name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon zip
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PACKAGE="ForeverRUFixes-${TAG}.zip"

          rm -rf dist
          mkdir -p dist/ForeverRUFixes

          cp ForeverRUFixes.toc dist/ForeverRUFixes/
          cp ForeverRUFixes.lua dist/ForeverRUFixes/

          (
            cd dist
            zip -r "../${PACKAGE}" ForeverRUFixes
          )

          echo "PACKAGE=${PACKAGE}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" \
            --title "ForeverRUFixes ${GITHUB_REF_NAME}" \
            --generate-notes
