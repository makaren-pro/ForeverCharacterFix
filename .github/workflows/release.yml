name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon zip
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3"
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE="ForeverRUFixes-${VERSION}.zip"

          rm -rf dist
          mkdir -p dist/ForeverRUFixes

          cp ForeverRUFixes.toc dist/ForeverRUFixes/
          cp ForeverRUFixes.lua dist/ForeverRUFixes/

          sed -i -E "s/^## Version:.*/## Version: ${VERSION}/" dist/ForeverRUFixes/ForeverRUFixes.toc
          sed -i -E "s/^local VERSION = \".*\"/local VERSION = \"${VERSION}\"/" dist/ForeverRUFixes/ForeverRUFixes.lua

          (
            cd dist
            zip -r "../${PACKAGE}" ForeverRUFixes
          )

          echo "PACKAGE=${PACKAGE}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" \
            --title "ForeverRUFixes ${GITHUB_REF_NAME}" \
            --generate-notes
